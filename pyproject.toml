[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmilieu"
version = "0.1.0"
description = "A trusted context compiler for on-device SLMs"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "gguf>=0.10", "huggingface_hub>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
tokenizers = ["tokenizers>=0.20"]
services = ["context.dev", "notion-client", "mistralai"]
app = ["gradio", "pypdf", "python-docx", "openpyxl", "python-pptx", "mcp", "rank-bm25", "python-dotenv", "pydantic"]

[project.scripts]
milieu = "agentmilieu.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
