[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmilieu"
version = "0.1.0"
description = "A trusted context compiler for on-device SLMs"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "gguf>=0.10", "huggingface_hub>=0.25", "requests>=2.25", "rank-bm25>=0.2.2", "mcp>=1.9,<2", "python-dotenv"]

[project.optional-dependencies]
chat = ["llama-cpp-python>=0.3"]
dev = ["pytest>=8", "ruff>=0.9", "reportlab", "pypdf", "python-docx", "openpyxl", "python-pptx"]
ingest = ["pypdf", "python-docx", "openpyxl", "python-pptx"]
tokenizers = ["tokenizers>=0.20"]
services = ["context.dev", "notion-client", "mistralai>=1,<2"]
app = ["gradio==6.32.0", "pypdf", "python-docx", "openpyxl", "python-pptx", "pydantic"]
product = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "google-auth>=2.40,<3", "itsdangerous>=2.2,<3", "python-multipart>=0.0.26,<1", "urllib3>=2.5,<3", "notion-client>=2,<4", "pypdf", "python-docx", "openpyxl", "python-pptx"]

[tool.setuptools.package-data]
"agentmilieu.product" = ["schema.sql", "static/*"]

[project.scripts]
milieu = "agentmilieu.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
